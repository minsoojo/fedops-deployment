{{- range $role, $p := .Values.persistence }}
{{- if not $p.existingClaim }}
{{- $name := include "fedops.claim" (dict "root" $ "role" $role) }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "fedops.labels" $ | nindent 4 }}
spec:
  capacity:
    storage: {{ $p.size }}
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: {{ $.Release.Namespace }}
    name: {{ $name }}
  local:
    path: {{ $p.path | quote }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [{{ $.Values.nodeName | quote }}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "fedops.labels" $ | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  storageClassName: ""
  volumeName: {{ $name }}
  resources:
    requests:
      storage: {{ $p.size }}
{{- end }}
{{- end }}
